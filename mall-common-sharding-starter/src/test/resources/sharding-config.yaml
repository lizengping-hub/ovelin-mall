
dataSources:
  sharding_test_ds0:
    jdbcUrl: jdbc:mysql://127.0.0.1:3308/sharding_test?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    username: ovelin
    password: ovelin
  sharding_test_ds1:
    jdbcUrl: jdbc:mysql://127.0.0.1:3309/sharding_test?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    username: ovelin
    password: ovelin


rules:
- !SHARDING
  tables:
    user:
      actualDataNodes: sharding_test_ds$->{0..1}.user_$->{0..1}
      databaseStrategy:
        standard:
          shardingColumn: id
          shardingAlgorithmName: ovelin_db_algo
      tableStrategy:
        standard:
          shardingColumn: id
          shardingAlgorithmName: ovelin_table_algo
    user_identity:
      actualDataNodes: sharding_test_ds$->{0..1}.user_identity_$->{0..1}
      databaseStrategy:
        complex:
          shardingColumns: id, identity_type, identifier
          shardingAlgorithmName: ovelin_db_indentity_algo
      tableStrategy:
        complex:
          shardingColumns: id, identity_type, identifier
          shardingAlgorithmName: ovelin_table_identity_algo
    user_by_phone_lookup:
      actualDataNodes: sharding_test_ds$->{0..1}.user_by_phone_lookup_$->{0..1}
      databaseStrategy:
        complex:
          shardingColumns: phone
          shardingAlgorithmName: ovelin_db_algo
      tableStrategy:
        complex:
          shardingColumns: phone
          shardingAlgorithmName: ovelin_table_algo

  shardingAlgorithms:
    ovelin_db_algo:
      type: OVELIN_STANDARD_DS_SHARDING
      props:
        table_count: 2
        ds_count: 2
    ovelin_table_algo:
      type: OVELIN_STANDARD_TABLE_SHARDING
      props:
        table_count: 2
        ds_count: 2
    ovelin_complex_db_algo:
      type: OVELIN_COMPLEX_DS_SHARDING
      props:
        table_count: 2
        ds_count: 2
    ovelin_complex_table_algo:
      type: OVELIN_COMPLEX_TABLE_SHARDING
      props:
        table_count: 2
        ds_count: 2
    ovelin_db_indentity_algo:
      type: OVELIN_COMPLEX_DS_SHARDING
      props:
        table_count: 2
        ds_count: 2
        sharding_string_field_0: identity_type
        sharding_string_field_1: identifier
    ovelin_table_identity_algo:
      type: OVELIN_COMPLEX_TABLE_SHARDING
      props:
        table_count: 2
        ds_count: 2
        sharding_string_field_0: identity_type
        sharding_string_field_1: identifier

props:
  sql-show: true