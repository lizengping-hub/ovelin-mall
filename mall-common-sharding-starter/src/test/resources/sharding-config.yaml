
dataSources:
  user_ds0:
    jdbcUrl: jdbc:mysql://127.0.0.1:3308/sharding_test_user_database?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    username: ovelin
    password: ovelin
  user_ds1:
    jdbcUrl: jdbc:mysql://127.0.0.1:3309/sharding_test_user_database?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    username: ovelin
    password: ovelin
  identity_ds0:
    jdbcUrl: jdbc:mysql://127.0.0.1:3308/sharding_test_identity_database?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    username: ovelin
    password: ovelin
  identity_ds1:
    jdbcUrl: jdbc:mysql://127.0.0.1:3309/sharding_test_identity_database?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    username: ovelin
    password: ovelin


rules:
- !SHARDING
  tables:
    sharding_test_user:
      actualDataNodes: user_ds$->{0..1}.sharding_test_user_$->{0..1}
      databaseStrategy:
        standard:
          shardingColumn: id
          shardingAlgorithmName: ovelin_db_algo
      tableStrategy:
        standard:
          shardingColumn: id
          shardingAlgorithmName: ovelin_table_algo
    sharding_test_identity:
      actualDataNodes: identity_ds$->{0..1}.sharding_test_identity_$->{0..1}
      databaseStrategy:
        complex:
          shardingColumns: id, identifier
          shardingAlgorithmName: ovelin_db_complex_algo
      tableStrategy:
        complex:
          shardingColumns: id, identifier
          shardingAlgorithmName: ovelin_table_complex_algo

  shardingAlgorithms:
    ovelin_db_algo:
      type: OVELIN_DS_STANDARD_SHARDING
      props:
        table-count: 2
        ds-count: 2
    ovelin_table_algo:
      type: OVELIN_TABLE_STANDARD_SHARDING
      props:
        table-count: 2
        ds-count: 2
    ovelin_db_complex_algo:
      type: OVELIN_DS_COMPLEX_SHARDING
      props:
        table-count: 2
        ds-count: 2
    ovelin_table_complex_algo:
      type: OVELIN_TABLE_COMPLEX_SHARDING
      props:
        table-count: 2
        ds-count: 2

props:
  sql-show: true