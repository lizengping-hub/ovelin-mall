spring:
  application:
    name: mall-user
id-generator:
  allocation-size: 1000

logging:
  file:
    name: logs/mall-user.log
  pattern:
    correlation: "[%X{requestId:-}] "
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.ovelin: ${LOG_LEVEL_APP:DEBUG}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 500MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

