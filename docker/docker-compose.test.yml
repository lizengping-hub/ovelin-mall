name: mall-test

services:
  mysql-instance-0:
    image: mysql:8.4
    container_name: mall-mysql-instance-0-test
    restart: unless-stopped
    ports:
      - "${EVOLIN_TEST_MYSQL_PORT_0:-3308}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mall-mysql-instance-0-test:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD" ]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 30s
  mysql-instance-1:
    image: mysql:8.4
    container_name: mall-mysql-instance-1-test
    restart: unless-stopped
    ports:
      - "${EVOLIN_TEST_MYSQL_PORT_1:-3309}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mall-mysql-instance-1-test:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD" ]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 30s
volumes:
  mall-mysql-instance-0-test:
    name: mall-mysql-instance-0-test
  mall-mysql-instance-1-test:
    name: mall-mysql-instance-1-test