spring:
  application:
    name: identity-service

ovelin:
  sharding:
    instances:
      mysql-instance-0:
        host: ${IDENTITY_DB_HOST_0:localhost}
        port: ${IDENTITY_DB_PORT_0:3307}
        username: ${IDENTITY_DB_USERNAME:identity_app}
        password: ${IDENTITY_DB_PASSWORD:identity_app}
        maximum-pool-size: 10
      mysql-instance-1:
        host: ${IDENTITY_DB_HOST_1:localhost}
        port: ${IDENTITY_DB_PORT_1:3308}
        username: ${IDENTITY_DB_USERNAME:identity_app}
        password: ${IDENTITY_DB_PASSWORD:identity_app}
        maximum-pool-size: 10
    shard-routes:
      user:
        name: user
        shard-count: 256
        routes:
          - from: 0
            to: 127
            instance: mysql-instance-0
            database: user_database
          - from: 128
            to: 255
            instance: mysql-instance-1
            database: user_database
      login:
        name: login
        shard-count: 256
        routes:
          - from: 0
            to: 127
            instance: mysql-instance-0
            database: login_database
          - from: 128
            to: 255
            instance: mysql-instance-1
            database: login_database
server:
  port: 8080

logging:
  file:
    name: logs/identity-service.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{requestId:-}] %-5level [%thread] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{requestId:-}] %-5level [%thread] %logger{36} - %msg%n"
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.identityservice: ${LOG_LEVEL_APP:INFO}
    com.identityservice.infrastructure.persistence.jdbc: ${LOG_LEVEL_REPOSITORY:DEBUG}
    com.identityservice.config: ${LOG_LEVEL_DATABASE:DEBUG}
    org.springframework.web: ${LOG_LEVEL_SPRING_WEB:INFO}
    com.zaxxer.hikari: ${LOG_LEVEL_HIKARI:INFO}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 500MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
